brand: trendscope
display_name: TrendScope
languages: [en]
formats:
  short: {aspect_ratio: "9:16", target_seconds: [30, 60]}
  long: {aspect_ratio: "16:9", target_minutes: [8, 15]}
editorial:
  coverage: [internet_culture, technology, artificial_intelligence, viral_stories, digital_business]
  promise: source-backed explanations and original commentary; no empty hype or misleading hooks
  freshness: verify developing claims against multiple sources and record timestamps
  localization: English edition only in this repository; Turkish localization is deferred until its own workflow and voice tests exist
long_form:
  render_from_reusable_scenes: true
  preserve_single_story_arc: true
  never_stitch_finished_shorts_with_repeated_hooks: true
publishing: {enabled: false, compliance_gate: true, human_approval: true}
